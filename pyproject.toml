[project]
name = "stringops"
version = "0.1.0"
description = "Simple string operations as an Arkitekt app"
readme = "README.md"
authors = [
    { name = "Johannes Roos", email = "jhnnsrs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # The rekuest runtime: what `run(app)` serves the actions with, and what the tests
    # call them through (arkitekt.testing).
    "arkitekt[rekuest]>=10.0.1",
]

[tool.semantic_release]
version_variables = ["app.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.release]
match = "main"
prerelease = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
